version: 2

updates:
  # Published Dev Container Features referenced in .devcontainer/devcontainer.json, and their digests in
  # .devcontainer/devcontainer-lock.json. The base image tag, the Feature options (SDK, Node, gh, Claude Code
  # versions) and the local Features are not covered and are bumped by hand (docs/DevContainer.md).
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
